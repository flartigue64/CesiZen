name: 02-2 - Delivery - Trivy Scan (Debug)

on:
  workflow_call

env:
  REGISTRY: ghcr.io
  USERNAME: ${{ github.actor }}
  IMAGE_NAME: ${{ github.repository }}  # Format: orga/repo

jobs:
  Trivy_Scan_Monolith:
    runs-on: ubuntu-latest

    steps:
      - name: Checkpoint — Début du job Trivy
        run: echo "✅ Job Trivy lancé"

      - name: Connexion au registre Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ secrets.MONOREPO_PAT }}

      - name: Downcase du nom d'image
        run: echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: DEBUG — Afficher nom d'image final
        run: |
          echo "Image ciblée : ghcr.io/${{ env.IMAGE_NAME_LOWER }}:canary"


      - name: DEBUG — Vérifier si image canary est pullable
        run: |
          echo "Tentative de pull : ghcr.io/${{ env.IMAGE_NAME_LOWER }}:canary"
          docker pull ghcr.io/${{ env.IMAGE_NAME_LOWER }}:canary || echo "❌ ECHEC DU PULL"

      - name: Installer Trivy (en ligne de commande)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Scanner l'image Docker avec Trivy (mode brut)
        run: |
          echo "🕵️‍♂️ Lancement Trivy scan"
          trivy image --exit-code 1 --severity CRITICAL,HIGH \
            ghcr.io/${{ env.IMAGE_NAME_LOWER }}:canary \
            --format table --ignore-unfixed \
            --output monolith-trivy-results.txt || echo "⚠️ Vulnérabilités détectées"

      - name: Afficher les résultats Trivy dans la console
        if: always()
        run: cat monolith-trivy-results.txt

      - name: Uploader le rapport Trivy
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monolith-trivy-results
          path: monolith-trivy-results.txt
          retention-days: 1
