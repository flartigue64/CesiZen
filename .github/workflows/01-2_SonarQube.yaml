name: 01-2 - Integration SonarQube

on:
  workflow_call

jobs:
  QualityCheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Backend Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-coverage-report
          path: coverage

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ReportGenerator (optional, for HTML report)
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Run SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_DOTNET_ENABLE_NET6: true # Utile si tu utilises .NET 6 ou plus
